
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Location Awareness</title>

<style>
body{
  font-family:Arial,sans-serif;
  text-align:center;
  padding:40px 20px;
  background:#f5f5f5;
}
.card{
  max-width:420px;
  margin:auto;
  background:white;
  padding:28px;
  border-radius:16px;
  box-shadow:0 4px 18px #0002;
}
h2{margin-top:0}
#status{
  margin-top:20px;
  line-height:1.6;
}
</style>
</head>

<body>

<div class="card">
  <h2>📍 Location Awareness</h2>

  <p>
    This demo requests your device location.
    Your location will be shared only after you allow
    the browser permission request.
  </p>

  <div id="status">Requesting location permission...</div>
</div>

<script>

// ===== SUPABASE SETTINGS =====
const SUPABASE_URL = "https://jxhplkuyeafuicbtbxes.supabase.co";
const SUPABASE_KEY = "sb_publishable_yZUSVCTw_7qJ9ydy5PqMxQ_ROEMJHTA";
// ==============================

async function requestLocation(){

  const status = document.getElementById("status"); 
  if(!navigator.geolocation){
    status.innerHTML = "❌ Location is not supported by this browser.";
    return;
  }

  navigator.geolocation.getCurrentPosition(

    async function(position){

      const latitude = position.coords.latitude;
      const longitude = position.coords.longitude;
      const accuracy = position.coords.accuracy;

      status.innerHTML = "📍 Location received. Saving securely...";

      try{

        const response = await fetch(
          SUPABASE_URL + "/rest/v1/Locations",
          {
            method:"POST",
            headers:{
              "apikey":SUPABASE_KEY,
              "Authorization":"Bearer " + SUPABASE_KEY,
              "Content-Type":"application/json",
              "Prefer":"return=minimal"
            },
            body:JSON.stringify({
              latitude:latitude,
              longitude:longitude,
              accuracy:accuracy
            })
          }
        );

        if(response.ok){
          status.innerHTML =
            "✅ Location shared successfully.";
        }else{
          const errorText = await response.text();
          console.error(errorText);
          status.innerHTML =
            "⚠️ Location received, but saving failed.";
        }

      }catch(error){

        console.error(error);

        status.innerHTML =
          "⚠️ Could not connect to the location server.";
      }
    },

    function(error){

      if(error.code === 1){
        status.innerHTML =
          "❌ Location permission was denied.";
      }else{
        status.innerHTML =
          "❌ Location could not be obtained.";
      }
    },

    {
      enableHighAccuracy:true,
      timeout:15000,
      maximumAge:0
    }
  );
}

// Request permission when page opens
requestLocation();

</script>

</body>
</html>
